name: MatchSplitter
options:
  bundleIdPrefix: com.matchsplitter
packages:
  EFQRCode:
    url: https://github.com/EFPrefix/EFQRCode.git
    from: 6.2.2
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS.git
    from: 8.0.0
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: 11.0.0
targets:
  MatchSplitter:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - MatchSplitterApp.swift
      - Models
      - Views
      - ViewModels
      - Services
      - Assets.xcassets
      - GoogleService-Info.plist
    dependencies:
      - package: EFQRCode
      - package: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseMessaging
      - package: Firebase
        product: FirebaseAuth
    settings:
      base:
        OTHER_LDFLAGS: ["-ObjC"]
        HEADER_SEARCH_PATHS: ["$(inherited)"]
        SWIFT_INCLUDE_PATHS: ["$(inherited)"]
    info:
      path: Info.plist
      properties:
        UILaunchScreen: {}
        GIDClientID: 933171043939-sfll588877ht08qi5dlsmf2jfdte93e1.apps.googleusercontent.com
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - com.googleusercontent.apps.933171043939-sfll588877ht08qi5dlsmf2jfdte93e1
          - CFBundleURLSchemes:
              - matchsplitter
