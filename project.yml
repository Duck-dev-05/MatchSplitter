name: MatchSplitter
options:
  bundleIdPrefix: com.matchsplitter
packages:
  EFQRCode:
    url: https://github.com/EFPrefix/EFQRCode.git
    from: 6.2.2
targets:
  MatchSplitter:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - MatchSplitterApp.swift
      - Models
      - Views
      - ViewModels
      - Services
      - Assets.xcassets
    dependencies:
      - package: EFQRCode
    info:
      path: Info.plist
      properties:
        UILaunchScreen: {}
