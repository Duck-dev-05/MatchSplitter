name: Build for Sideloadly (Real iPhone)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install XcodeGen
      run: brew install xcodegen
      
    - name: Generate Xcode Project
      run: xcodegen generate
      
    - name: Build for iOS Device (Unsigned)
      run: |
        xcodebuild \
          -project MatchSplitter.xcodeproj \
          -scheme MatchSplitter \
          -sdk iphoneos \
          -configuration Release \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          AD_HOC_CODE_SIGNING_ALLOWED=YES \
          CONFIGURATION_BUILD_DIR="$(pwd)/build" \
          clean build
          
    - name: Package .ipa
      run: |
        brew install ldid
        mkdir -p Payload
        cp -R build/MatchSplitter.app Payload/
        ldid -S Payload/MatchSplitter.app
        zip -qr MatchSplitter.ipa Payload -x "*.DS_Store" -x "*__MACOSX*"
        
    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MatchSplitter-IPA
        path: MatchSplitter.ipa
